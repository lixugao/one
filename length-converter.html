<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="在线长度单位换算：在米、厘米和英尺之间实时转换，适配手机屏幕。">
  <title>长度单位换算 · 米 / 厘米 / 英尺</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --ink: #1c1917;
      --muted: #6b645e;
      --faint: #767069;
      --line: #e7e5e4;
      --line-soft: #f5f5f4;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --accent-soft: #ccfbf1;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --radius-lg: 24px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 12% 8%, rgba(15, 118, 110, 0.1), transparent 42%),
        radial-gradient(circle at 92% 92%, rgba(217, 119, 6, 0.09), transparent 46%),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .shell {
      width: 100%;
      max-width: 430px;
    }

    .converter {
      padding: clamp(22px, 6.4vw, 32px);
      background: var(--card);
      border: 1px solid rgba(28, 25, 23, 0.06);
      border-radius: var(--radius-lg);
      box-shadow:
        0 1px 2px rgba(28, 25, 23, 0.04),
        0 28px 60px -28px rgba(28, 25, 23, 0.28);
    }

    .head::before {
      content: "";
      display: block;
      width: 76px;
      height: 11px;
      margin-bottom: 20px;
      background:
        repeating-linear-gradient(90deg, var(--accent) 0 1.5px, transparent 1.5px 25px) left bottom / 100% 11px no-repeat,
        repeating-linear-gradient(90deg, var(--accent) 0 1px, transparent 1px 8px) left bottom / 100% 5px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left bottom / 100% 2px no-repeat;
      opacity: 0.85;
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 7.2vw, 31px);
      font-weight: 750;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .lede {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .form {
      margin-top: 26px;
    }

    .field-label {
      display: block;
      margin: 0 0 8px;
      padding: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      background: #fafaf9;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .input-shell:focus-within {
      background: var(--card);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .input-shell.has-error {
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .input-shell.has-error:focus-within {
      box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.12);
    }

    .value-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 15px 0;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--ink);
      font: inherit;
      font-size: 22px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .value-input::placeholder {
      color: var(--faint);
      font-weight: 500;
    }

    .input-unit {
      flex: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }

    .units {
      min-width: 0;
      margin: 18px 0 0;
      padding: 0;
      border: 0;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      padding: 4px;
      background: var(--line-soft);
      border-radius: 13px;
    }

    .segment {
      position: relative;
      cursor: pointer;
    }

    .segment input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .segment__face {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-height: 48px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.2;
      transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .segment__face small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .segment input:checked + .segment__face {
      background: var(--card);
      color: var(--ink);
      box-shadow:
        0 1px 2px rgba(28, 25, 23, 0.08),
        0 1px 1px rgba(28, 25, 23, 0.03);
    }

    .segment input:checked + .segment__face small {
      color: var(--accent);
    }

    .segment input:focus-visible + .segment__face {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hint {
      min-height: 20px;
      margin: 11px 2px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      transition: color 0.15s ease;
    }

    .hint.is-error {
      color: var(--danger);
      font-weight: 600;
    }

    .results {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--line);
    }

    .results-title {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .result-list {
      margin: 0;
    }

    .result-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 2px;
    }

    .result-row + .result-row {
      border-top: 1px solid var(--line-soft);
    }

    .result-row dt {
      flex: none;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .result-row dt small {
      margin-left: 4px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .result-row dd {
      min-width: 0;
      margin: 0;
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.3;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .result-row dd.is-empty {
      color: var(--faint);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .footnote {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .noscript {
      margin: 12px 2px 0;
      color: var(--danger);
      font-size: 13px;
    }

    @media (max-width: 359px) {
      .converter {
        padding: 20px 18px;
      }

      .result-row dd {
        font-size: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="converter" aria-labelledby="page-title">
      <header class="head">
        <p class="kicker">单位换算</p>
        <h1 id="page-title">长度单位换算</h1>
        <p class="lede">在米、厘米和英尺之间实时换算。</p>
      </header>

      <div class="form" id="converter">
        <div class="field">
          <label class="field-label" for="value">输入数值</label>
          <div class="input-shell" id="input-shell">
            <input
              class="value-input"
              id="value"
              name="value"
              type="text"
              inputmode="decimal"
              enterkeyhint="done"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="例如 1.5"
              aria-describedby="hint"
            >
            <span class="input-unit" id="input-unit-label">米</span>
          </div>
        </div>

        <fieldset class="units">
          <legend class="field-label">输入单位</legend>
          <div class="segmented">
            <label class="segment">
              <input type="radio" name="unit" value="m" checked>
              <span class="segment__face">米 <small>m</small></span>
            </label>
            <label class="segment">
              <input type="radio" name="unit" value="cm">
              <span class="segment__face">厘米 <small>cm</small></span>
            </label>
            <label class="segment">
              <input type="radio" name="unit" value="ft">
              <span class="segment__face">英尺 <small>ft</small></span>
            </label>
          </div>
        </fieldset>

        <p class="hint" id="hint" role="status">支持小数，例如 1.5</p>
      </div>

      <section class="results" aria-labelledby="results-title">
        <h2 class="results-title" id="results-title">换算结果</h2>
        <dl class="result-list">
          <div class="result-row">
            <dt>米 <small>m</small></dt>
            <dd id="result-m" class="is-empty">—</dd>
          </div>
          <div class="result-row">
            <dt>厘米 <small>cm</small></dt>
            <dd id="result-cm" class="is-empty">—</dd>
          </div>
          <div class="result-row">
            <dt>英尺 <small>ft</small></dt>
            <dd id="result-ft" class="is-empty">—</dd>
          </div>
        </dl>
        <p class="footnote">换算基准：1 英尺 = 0.3048 米</p>
      </section>

      <noscript>
        <p class="noscript">请启用 JavaScript 后使用实时换算。</p>
      </noscript>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var METERS_PER_FOOT = 0.3048;
      var DEFAULT_HINT = '支持小数，例如 1.5';

      var units = {
        m: {
          label: '米',
          toMeters: function (value) { return value; },
          fromMeters: function (meters) { return meters; }
        },
        cm: {
          label: '厘米',
          toMeters: function (value) { return value / 100; },
          fromMeters: function (meters) { return meters * 100; }
        },
        ft: {
          label: '英尺',
          toMeters: function (value) { return value * METERS_PER_FOOT; },
          fromMeters: function (meters) { return meters / METERS_PER_FOOT; }
        }
      };

      var converter = document.getElementById('converter');
      var input = document.getElementById('value');
      var inputShell = document.getElementById('input-shell');
      var inputUnitLabel = document.getElementById('input-unit-label');
      var hint = document.getElementById('hint');
      var unitRadios = converter.querySelectorAll('input[name="unit"]');
      var outputs = {
        m: document.getElementById('result-m'),
        cm: document.getElementById('result-cm'),
        ft: document.getElementById('result-ft')
      };
      var unitKeys = Object.keys(units);

      function currentUnit() {
        for (var i = 0; i < unitRadios.length; i += 1) {
          if (unitRadios[i].checked) {
            return unitRadios[i].value;
          }
        }
        return 'm';
      }

      function parseInput(raw) {
        var text = raw.trim();

        if (text === '') {
          return { state: 'empty' };
        }

        if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(text)) {
          return { state: 'invalid' };
        }

        var value = Number(text);

        if (!isFinite(value)) {
          return { state: 'overflow' };
        }

        if (value < 0) {
          return { state: 'negative' };
        }

        return { state: 'valid', value: value };
      }

      function formatNumber(value) {
        if (!isFinite(value)) {
          return '—';
        }

        if (value === 0) {
          return '0';
        }

        var abs = Math.abs(value);
        var text;

        if (abs >= 1e12 || abs < 1e-6) {
          text = value.toExponential(4).replace(/\.?0+e/, 'e');
          return text;
        }

        if (abs >= 1) {
          text = value.toFixed(6);
        } else {
          text = value.toFixed(Math.min(12, Math.ceil(-Math.log10(abs)) + 5));
        }

        return text.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
      }

      function setOutputs(values) {
        unitKeys.forEach(function (key) {
          var output = outputs[key];
          if (values) {
            output.textContent = formatNumber(values[key]);
            output.classList.remove('is-empty');
          } else {
            output.textContent = '—';
            output.classList.add('is-empty');
          }
        });
      }

      function setHint(message, isError) {
        hint.textContent = message;
        hint.classList.toggle('is-error', Boolean(isError));
      }

      function setInvalid(isInvalid) {
        input.setAttribute('aria-invalid', isInvalid ? 'true' : 'false');
        inputShell.classList.toggle('has-error', isInvalid);
      }

      function render() {
        var unit = units[currentUnit()];
        inputUnitLabel.textContent = unit.label;

        var parsed = parseInput(input.value);

        if (parsed.state === 'empty') {
          setOutputs(null);
          setHint(DEFAULT_HINT, false);
          setInvalid(false);
          return;
        }

        if (parsed.state === 'invalid') {
          setOutputs(null);
          setHint('请输入有效数字，例如 1.5', true);
          setInvalid(true);
          return;
        }

        if (parsed.state === 'negative') {
          setOutputs(null);
          setHint('长度不能为负数', true);
          setInvalid(true);
          return;
        }

        if (parsed.state === 'overflow') {
          setOutputs(null);
          setHint('数值过大，请换个数值', true);
          setInvalid(true);
          return;
        }

        var meters = unit.toMeters(parsed.value);
        setOutputs({
          m: units.m.fromMeters(meters),
          cm: units.cm.fromMeters(meters),
          ft: units.ft.fromMeters(meters)
        });
        setHint(DEFAULT_HINT, false);
        setInvalid(false);
      }

      input.addEventListener('input', render);

      for (var i = 0; i < unitRadios.length; i += 1) {
        unitRadios[i].addEventListener('change', render);
      }

      render();
    }());
  </script>
</body>
</html>
