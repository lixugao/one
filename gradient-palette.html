<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090c">
<meta name="description" content="一个深色背景的渐变配色展示页：点击色块切换配色，点按色值即可复制 HEX。">
<title>渐变配色 · Gradient Palette</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFB86B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #08090c;
    --text: #f5f6fa;
    --muted: #9aa0b0;
    --line: rgba(255, 255, 255, 0.08);
    --c1: #ff6b6b;
    --c2: #ffb86b;
    --glow1: rgba(255, 107, 107, 0.18);
    --glow2: rgba(255, 184, 107, 0.16);
    --radius: 28px;
    color-scheme: dark;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 24px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .ambient {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(55rem 34rem at 50% -12%, rgba(255, 255, 255, 0.055), transparent 62%),
      radial-gradient(30rem 26rem at 12% 14%, var(--glow1), transparent 70%),
      radial-gradient(30rem 26rem at 88% 84%, var(--glow2), transparent 72%);
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    animation: rise 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 26px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--muted);
  }

  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background-image: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 0 12px var(--c1);
    transition: box-shadow 0.6s ease;
  }

  .counter {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .name-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 6.6vw, 32px);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .swatch {
    position: relative;
    display: block;
    width: 100%;
    height: clamp(210px, 46vh, 430px);
    padding: 0;
    border: 0;
    border-radius: var(--radius);
    overflow: hidden;
    isolation: isolate;
    background: #14161c;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    box-shadow:
      0 34px 80px -34px var(--c1),
      0 20px 64px -32px var(--c2),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.6s ease;
  }

  .swatch-layer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    inset: 0;
    background-position: center;
    background-size: cover;
    opacity: 0;
    transition: opacity 0.55s ease;
  }

  .swatch-layer.is-front { opacity: 1; }

  .swatch::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    inset: 0;
    z-index: 2;
    border-radius: inherit;
    pointer-events: none;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.16),
      inset 0 -70px 90px -50px rgba(0, 0, 0, 0.22);
  }

  .swatch:active { transform: scale(0.988); }

  .swatch:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.85);
    outline-offset: 4px;
  }

  .swatch-badge {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    background: rgba(10, 12, 16, 0.62);
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.04em;
    line-height: 1;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    pointer-events: none;
  }

  .swatch-badge svg {
    width: 13px;
    height: 13px;
    flex: none;
  }

  .tokens {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  .token {
    display: flex;
    flex-direction: column;
    gap: 15px;
    min-width: 0;
    padding: 14px 14px 13px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.022));
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s ease, border-color 0.25s ease, background-color 0.25s ease;
  }

  .token:active { transform: scale(0.985); }

  .token:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.8);
    outline-offset: 2px;
  }

  .token.is-copied {
    border-color: rgba(126, 226, 168, 0.55);
  }

  .token-head {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .token-dot {
    width: 14px;
    height: 14px;
    flex: none;
    border-radius: 50%;
    background: var(--swatch, var(--c1));
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.28),
      0 0 12px -2px var(--swatch, var(--c1));
    transition: background-color 0.5s ease;
  }

  .token-kind {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--muted);
    white-space: nowrap;
  }

  .token-action {
    margin-left: auto;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
    white-space: nowrap;
    transition: color 0.2s ease;
  }

  .token.is-copied .token-action { color: #7ee2a8; }

  .token-hex {
    display: block;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: clamp(15px, 4.4vw, 18px);
    font-weight: 500;
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .footnote {
    margin: 16px 2px 0;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 10;
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(245, 246, 250, 0.96);
    color: #0b0c10;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 10px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  }

  .toast.is-visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  @media (hover: hover) and (pointer: fine) {
    .swatch:hover { transform: translateY(-2px); }

    .token:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.085), rgba(255, 255, 255, 0.035));
    }
  }

  @media (min-width: 600px) {
    body { padding: 40px 28px calc(40px + env(safe-area-inset-bottom, 0px)); }
    .topbar { margin-bottom: 30px; }
    .name-row { margin-bottom: 16px; }
    .tokens { gap: 12px; margin-top: 14px; }
    .token { padding: 16px 16px 15px; }
    .footnote { margin-top: 18px; }
  }

  @media (max-width: 359px) {
    body { padding-left: 14px; padding-right: 14px; }
    .tokens { gap: 8px; }
    .token { padding: 12px 11px 11px; border-radius: 16px; }
    .token-kind { letter-spacing: 0.04em; }
    .token-head { gap: 6px; }
    .token-action { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>渐变配色</span>
      </div>
      <span class="counter" id="counter">01 / 14</span>
    </header>

    <div class="name-row">
      <h1 id="palette-name">暮色珊瑚</h1>
    </div>

    <button class="swatch" id="swatch" type="button" aria-label="换一组渐变配色，当前暮色珊瑚">
      <span class="swatch-layer is-front" aria-hidden="true"></span>
      <span class="swatch-layer" aria-hidden="true"></span>
      <span class="swatch-badge" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 2.6v3.7H9.8"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        换一组
      </span>
    </button>

    <section class="tokens" aria-label="当前配色色值">
      <button class="token" id="token-start" type="button" data-hex="#FF6B6B">
        <span class="token-head">
          <span class="token-dot" aria-hidden="true"></span>
          <span class="token-kind">起始色</span>
          <span class="token-action">复制</span>
        </span>
        <span class="token-hex">#FF6B6B</span>
      </button>

      <button class="token" id="token-end" type="button" data-hex="#FFB86B">
        <span class="token-head">
          <span class="token-dot" aria-hidden="true"></span>
          <span class="token-kind">结束色</span>
          <span class="token-action">复制</span>
        </span>
        <span class="token-hex">#FFB86B</span>
      </button>
    </section>

    <p class="footnote">点色块换一组 · 点色值复制</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  var palettes = [
    { name: "暮色珊瑚", colors: ["#FF6B6B", "#FFB86B"] },
    { name: "极光青",   colors: ["#00F5A0", "#00D9F5"] },
    { name: "紫罗兰梦", colors: ["#A18CD1", "#FBC2EB"] },
    { name: "深海秘境", colors: ["#2E3192", "#1BFFFF"] },
    { name: "落日熔金", colors: ["#FF512F", "#F09819"] },
    { name: "薄荷苏打", colors: ["#43E97B", "#38F9D7"] },
    { name: "霓虹脉冲", colors: ["#FA8BFF", "#2BD2FF"] },
    { name: "星夜蓝调", colors: ["#4776E6", "#8E54E9"] },
    { name: "蜜桃气泡", colors: ["#FF9A9E", "#FAD0C4"] },
    { name: "熔岩之心", colors: ["#F83600", "#F9D423"] },
    { name: "森林晨雾", colors: ["#11998E", "#38EF7D"] },
    { name: "冰川蓝",   colors: ["#89F7FE", "#66A6FF"] },
    { name: "薄暮紫",   colors: ["#654EA3", "#EAAFC8"] },
    { name: "柑橘日出", colors: ["#F7971E", "#FFD200"] }
  ];

  var root = document.documentElement;
  var swatch = document.getElementById("swatch");
  var layers = Array.prototype.slice.call(document.querySelectorAll(".swatch-layer"));
  var nameEl = document.getElementById("palette-name");
  var counterEl = document.getElementById("counter");
  var tokens = Array.prototype.slice.call(document.querySelectorAll(".token"));
  var toast = document.getElementById("toast");
  var announcer = document.getElementById("announcer");

  var current = 0;
  var front = 0;
  var copyTimer = null;
  var toastTimer = null;

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function gradientOf(palette) {
    return "linear-gradient(135deg, " + palette.colors[0] + " 0%, " + palette.colors[1] + " 100%)";
  }

  function paint(index) {
    var next = 1 - front;
    layers[next].style.backgroundImage = gradientOf(palettes[index]);
    // Flush the new background before fading the layer in.
    void layers[next].offsetWidth;
    layers[next].classList.add("is-front");
    layers[front].classList.remove("is-front");
    front = next;
  }

  function setMeta(index) {
    var palette = palettes[index];
    var c1 = palette.colors[0];
    var c2 = palette.colors[1];

    root.style.setProperty("--c1", c1);
    root.style.setProperty("--c2", c2);
    root.style.setProperty("--glow1", c1 + "2e");
    root.style.setProperty("--glow2", c2 + "29");

    nameEl.textContent = palette.name;
    counterEl.textContent = pad(index + 1) + " / " + pad(palettes.length);
    swatch.setAttribute("aria-label", "换一组渐变配色，当前" + palette.name);

    tokens.forEach(function (token, i) {
      var hex = palette.colors[i];
      token.dataset.hex = hex;
      token.querySelector(".token-dot").style.setProperty("--swatch", hex);
      token.querySelector(".token-hex").textContent = hex;
      token.classList.remove("is-copied");
      token.querySelector(".token-action").textContent = "复制";
    });
  }

  function pickNext() {
    var total = palettes.length;
    if (total < 2) return 0;
    var next = current;
    while (next === current) {
      next = Math.floor(Math.random() * total);
    }
    return next;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("is-visible");
    }, 1800);
  }

  function announce(message) {
    announcer.textContent = message;
  }

  function writeClipboard(text) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function" && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0;";
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, text.length);
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (error) {
      ok = false;
    }
    area.remove();
    return ok;
  }

  swatch.addEventListener("click", function () {
    current = pickNext();
    paint(current);
    setMeta(current);
    announce("已切换到 " + palettes[current].name + "，" + palettes[current].colors.join(" 到 "));
  });

  tokens.forEach(function (token) {
    token.addEventListener("click", function () {
      var hex = token.dataset.hex;
      writeClipboard(hex).then(function (ok) {
        if (!ok) {
          showToast("复制失败，请长按色值手动复制");
          return;
        }
        // Ignore feedback if the palette changed while the clipboard request was in flight.
        if (token.dataset.hex !== hex) return;
        tokens.forEach(function (other) {
          other.classList.remove("is-copied");
          other.querySelector(".token-action").textContent = "复制";
        });
        token.classList.add("is-copied");
        token.querySelector(".token-action").textContent = "已复制";
        showToast("已复制 " + hex);
        clearTimeout(copyTimer);
        copyTimer = setTimeout(function () {
          token.classList.remove("is-copied");
          token.querySelector(".token-action").textContent = "复制";
        }, 1600);
      });
    });
  });

  // Initial state: paint the first palette without a crossfade.
  layers[0].style.backgroundImage = gradientOf(palettes[0]);
  front = 0;
  setMeta(0);
})();
</script>
</body>
</html>
